server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name access.urban-queen.com;

    ssl_certificate /etc/letsencrypt/live/access.urban-queen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/access.urban-queen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/urbanqueen-access/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location /join/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name access.urban-queen.com;
    return 301 https://$host$request_uri;
}
